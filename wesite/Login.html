<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in &mdash; FestiveShop</title>
    <link rel="stylesheet" href="site.css">
</head>
<body class="site">

<header data-site-nav></header>

<main class="site-main">

    <div class="auth-card">
        <span class="eyebrow">Welcome back</span>
        <h1>Log in</h1>
        <p class="sub">Sign in to see your orders and saved addresses.</p>

        <form data-login novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required autocomplete="username" placeholder="yourname">
                <span class="err">Please enter your username.</span>
            </div>

            <div class="field">
                <label for="pwd">Password</label>
                <input id="pwd" name="pwd" type="password" required autocomplete="current-password" placeholder="••••••••">
                <span class="err">Password must be at least 6 characters.</span>
            </div>

            <div class="form-row">
                <label class="check">
                    <input type="checkbox" name="remember" checked> Remember me
                </label>
                <a class="check" style="justify-content:flex-end;" href="forgotpass.html">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn--gold btn--block">Log in</button>
        </form>

        <p class="auth-alt">
            Don't have an account? <a href="registration.html">Register</a>
        </p>

        <div class="socials">
            <a href="https://www.facebook.com/" rel="noopener">&#10024; Continue with Facebook</a>
            <a href="https://www.instagram.com/accounts/login/" rel="noopener">&#10024; Continue with Instagram</a>
            <a href="https://x.com/i/flow/login" rel="noopener">&#10024; Continue with X</a>
        </div>
    </div>

</main>

<footer class="site-footer" data-site-footer></footer>

<script src="products.js"></script>
<script src="site.js"></script>
<script>
    Shop.init('Login.html');

    document.querySelector('[data-login]').addEventListener('submit', function (event) {
        event.preventDefault();

        var ok = true;
        this.querySelectorAll('[required]').forEach(function (input) {
            var valid = input.value.trim() !== '' && input.checkValidity();
            input.closest('.field').dataset.invalid = valid ? 'false' : 'true';
            if (!valid) ok = false;
        });

        if (!ok) {
            Shop.toast('Please fix the highlighted fields.', '⚠️');
            return;
        }

        Shop.toast('Logged in. Welcome back!', '👋');
        window.setTimeout(function () {
            window.location.href = 'home.html';
        }, 900);
    });
</script>
</body>
</html>
